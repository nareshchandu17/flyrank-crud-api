services:
  api:
    build: .
    container_name: flyrank_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://flyrank:flyrank123@db:5432/flyrank_db
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: flyrank_postgres
    environment:
      POSTGRES_USER: flyrank
      POSTGRES_PASSWORD: flyrank123
      POSTGRES_DB: flyrank_db
    ports:
      - "5433:5432"
    volumes:
      - taskdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyrank -d flyrank_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flyrank_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  taskdata:
